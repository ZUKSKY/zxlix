<svg width="720" height="180" viewBox="0 0 720 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ZXLIX Anime Lens Logo</title>
  <desc id="desc">ZXLIX wordmark with cyan anime lens Z icon on dark background.</desc>
  <defs>
    <linearGradient id="cyan" x1="26" y1="22" x2="149" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F7FF"/>
      <stop offset="0.42" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="word" x1="192" y1="44" x2="612" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-60" y="-60" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#38BDF8" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#0EA5E9" flood-opacity="0.42"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <rect x="18" y="18" width="144" height="144" rx="36" fill="#020617" stroke="rgba(125,211,252,.22)"/>
    <path d="M35 90C58 55 122 55 145 90C122 125 58 125 35 90Z" fill="rgba(14,165,233,.12)" stroke="url(#cyan)" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="90" cy="90" r="34" fill="#061524" stroke="#38BDF8" stroke-width="5"/>
    <path d="M66 72H113L68 108H116" stroke="url(#cyan)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="90" cy="90" r="7" fill="#E0F7FF"/>
    <path d="M118 62L133 47" stroke="#E0F7FF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>
  <text x="194" y="116" fill="url(#word)" font-family="Inter, ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="84" font-weight="950" letter-spacing="-7">zxlix</text>
  <text x="200" y="146" fill="#7DD3FC" opacity="0.62" font-family="Inter, ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="16" font-weight="800" letter-spacing="5">ANIME STREAMING INDEX</text>
</svg>
